name: Daily Stock Chip Update

on:
  schedule:
    # 台灣時間每日 19:23（UTC 11:23，避開整點尖峰佇列）；週一至週五執行
    - cron: "23 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas yfinance beautifulsoup4 urllib3
          fi

      - name: Run data_engine.py to update all saved stocks
        env:
          TZ: Asia/Taipei
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python backfill_conc.py

      - name: Commit and push updated database files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: daily stock chip update ($(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M'))"
            git pull --rebase origin main
            git push origin main
          fi
